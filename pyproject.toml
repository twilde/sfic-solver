[build-system]
requires = ["setuptools>=77"]      # 77+ understands the SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "sfic-solver"
dynamic = ["version"]          # single source: sfic_solver.__version__
description = "Plan and check a master-keyed SFIC (small format interchangeable core) key system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []          # standard library only

[project.optional-dependencies]
test = ["pytest"]
# Optional, for reading scanned charts only; the core tools need none of it (D2, D38).
scan = ["Pillow", "numpy", "pypdfium2"]

[project.scripts]
sfic-gen-bittings = "sfic_solver.gen_bittings:main"
sfic-check-bittings = "sfic_solver.check_bittings:main"
sfic-check-system = "sfic_solver.check_system:main"
sfic-solve-system = "sfic_solver.solve_system:main"
sfic-pin-system = "sfic_solver.pin_system:main"
sfic-scan-charts = "sfic_solver.scan_charts:main"
sfic-check-charts = "sfic_solver.check_charts:main"

[tool.setuptools]
packages = ["sfic_solver", "sfic_solver.scanning"]

[tool.setuptools.dynamic]
version = {attr = "sfic_solver.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: the scanner's full-size quality runs, only with --runslow (tests/test_scan_harness.py)"]
