[build-system]
requires = ["setuptools>=77"]      # 77+ understands the SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "sfic-solver"
dynamic = ["version"]          # single source: sfic_solver.__version__
description = "Plan and check a master-keyed SFIC (small format interchangeable core) key system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []          # standard library only

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sfic-gen-bittings = "sfic_solver.gen_bittings:main"
sfic-check-bittings = "sfic_solver.check_bittings:main"
sfic-check-system = "sfic_solver.check_system:main"
sfic-solve-system = "sfic_solver.solve_system:main"
sfic-check-charts = "sfic_solver.check_charts:main"

[tool.setuptools]
packages = ["sfic_solver"]

[tool.setuptools.dynamic]
version = {attr = "sfic_solver.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
