name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: No stray data files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the history check needs every commit
      - name: Only system.example.json and tests/fixtures/ may be tracked (.json, .csv)
        run: python3 scripts/check_no_stray_data.py --tracked
      - name: ...and none may ever have been committed
        run: python3 scripts/check_no_stray_data.py --history

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Runners are pinned rather than ubuntu-latest, which is moving to 26.04
        # in late 2026. Python 3.9 has no build for 26.04, so the full matrix
        # stays on 24.04, plus one job to see how 26.04 behaves ahead of time.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-26.04
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Installed commands run
        run: |
          sfic-check-system tests/fixtures/clean.json
          sfic-gen-bittings OOEOEOE -n 3
